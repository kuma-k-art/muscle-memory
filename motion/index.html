<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="../favicon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef1f4;color:#25374a;font:13px system-ui,sans-serif}#stage{height:260px;position:relative;overflow:hidden}#still,canvas{position:absolute;width:100%;height:100%;object-fit:contain}canvas{opacity:0;transition:opacity .25s}#state{position:absolute;top:10px;left:12px;background:#ffffffd9;padding:4px 9px;border-radius:12px;font-size:11px}#phase{position:absolute;bottom:8px;right:12px;color:#506377;font-size:11px}.controls{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:6px}button,select{font:inherit;background:white;color:#25374a;border:1px solid #cad4de;border-radius:8px;padding:8px;min-height:36px}button:focus-visible,select:focus-visible{outline:2px solid #227bd2}p{margin:3px 10px 8px;font-size:11px;color:#53687b}button[aria-pressed=true]{background:#d9eaff}
.controls button{font-size:12px;padding:6px}
body[data-presentation=teaching] #stage{height:clamp(310px,100vw,390px)}
</style>
<div id="stage" role="img" aria-label="器具と対象筋を示すフォーム模式図"><img id="still" alt="開始姿勢"><span id="state">3Dを読み込み中</span><span id="phase">開始姿勢</span></div>
<div class="controls"><button id="play" aria-label="モーションを再生">▶ 再生</button><button id="front">正面</button><button id="side">側面</button><button id="back">背面</button><button id="reset">開始姿勢</button><button id="end">終了姿勢</button></div>
<div class="controls"><label>速度 <select id="speed"><option value="1">1x</option><option value="0.5">0.5x</option></select></label><label>品質 <select id="quality"><option value="low">Low</option><option value="medium">Medium</option><option value="high" selected>High</option></select></label></div>
<p>赤：メイン　薄いオレンジ：サブ　青矢印：動作方向　独自の模式モデル</p>
<script type="module">
const id=new URLSearchParams(location.search).get('id');
if(/^[a-z_]+$/.test(id||''))document.querySelector('#still').src='../assets/assets/exercise_visuals/thumbs/motion_'+id+'.webp';
import('./viewer.js').then(m=>m.start(id)).catch(()=>{document.querySelector('#state').textContent='開始・終了の静止画';document.querySelector('#end').style.display='';for(const [button,frame] of [['reset',0],['end',2]])document.getElementById(button).onclick=()=>document.querySelector('#still').src='../assets/assets/exercise_visuals/detail/motion_'+id+'-'+frame+'.webp';document.querySelector('#play').disabled=true;});
</script></html>
